<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INICS Sourcing · México</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ════════ 디자인 토큰 · "원장 + 청사진" ════════ */
:root{
  --ink:#16233B;--ink-soft:#2A3958;--surface:#F4F2EC;--card:#FFFFFF;
  --line:#E6E2D7;--line-strong:#D2CCBC;--muted:#6B7180;
  --brass:#A9791F;--brass-hi:#C79437;--brass-soft:#F1E6CC;
  --furn:#2E6B58;--furn-soft:#E1EEE8;--cons:#385A8C;--cons-soft:#E1E9F4;
  --danger:#9E3A2E;--danger-soft:#F3E2DE;
  --radius:14px;--radius-sm:9px;
  --shadow:0 1px 2px rgba(22,35,59,.05),0 10px 28px rgba(22,35,59,.07);
  --shadow-sm:0 1px 2px rgba(22,35,59,.06),0 3px 10px rgba(22,35,59,.05);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:"Pretendard Variable","Pretendard",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ui);background:radial-gradient(1200px 500px at 100% -10%,rgba(169,121,31,.05),transparent 60%),var(--surface);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.en{color:var(--muted);font-weight:500}

/* 앱바 */
.appbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;padding:14px 26px;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;user-select:none}
.brand .mark{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--card);background:var(--ink);padding:6px 10px;border-radius:8px}
.brand .sub{font-size:12.5px;color:var(--muted)}
.brand .sub b{color:var(--brass);font-weight:600}
.spacer{flex:1}
.cur-sel{appearance:none;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-size:12.5px;font-weight:600;padding:8px 30px 8px 11px;border-radius:8px;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' fill='none'><path d='M1 1l4 4 4-4' stroke='%236B7180' stroke-width='1.5'/></svg>");background-repeat:no-repeat;background-position:right 11px center}
.lockbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--card);padding:8px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:.15s}
.lockbtn:hover{border-color:var(--brass);color:var(--brass)}
.lockbtn.on{background:var(--danger);border-color:var(--danger);color:#fff}
.lockbtn.on:hover{color:#fff;filter:brightness(1.06)}
.lockbtn .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.lockbtn.on .dot{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}

/* 레이아웃 */
.wrap{max-width:1160px;margin:0 auto;padding:28px 26px 90px}
.nav{display:flex;gap:4px;margin:0 auto 26px;max-width:1160px;padding:0 26px;flex-wrap:wrap}
.tab{border:none;background:transparent;color:var(--muted);padding:9px 15px;border-radius:9px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s}
.tab small{font-weight:500;font-size:11px;opacity:.7}
.tab:hover{color:var(--ink);background:rgba(22,35,59,.045)}
.tab.active{background:var(--ink);color:#fff}
.tab .badge{font-family:var(--mono);font-size:11px;font-weight:600;background:var(--brass);color:#fff;border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
.tab.active .badge{background:rgba(255,255,255,.22)}
.tab.admin{color:var(--danger)}
.tab.admin.active{background:var(--danger);color:#fff}

/* 홈 */
.hero-line{font-size:13px;color:var(--muted);margin:0 0 6px;letter-spacing:.04em;font-weight:600;text-transform:uppercase}
.hero-h{font-size:27px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em}
.hero-h .en{font-size:19px;margin-left:8px}
.hero-p{color:var(--muted);font-size:13.5px;margin:0 0 30px;max-width:640px;line-height:1.6}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cat-card{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:26px 24px;box-shadow:var(--shadow-sm);transition:transform .18s,box-shadow .18s,border-color .18s;text-align:left}
.cat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-strong)}
.cat-card .rail{position:absolute;left:0;top:0;bottom:0;width:5px}
.cat-card.furn .rail{background:var(--furn)}
.cat-card.cons .rail{background:var(--cons)}
.cat-card .tagchip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:20px;letter-spacing:.03em}
.cat-card.furn .tagchip{background:var(--furn-soft);color:var(--furn)}
.cat-card.cons .tagchip{background:var(--cons-soft);color:var(--cons)}
.cat-card h3{font-size:20px;margin:14px 0 2px;letter-spacing:-.02em}
.cat-card h3 .en{font-size:14px;margin-left:7px}
.cat-card .desc{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 20px;min-height:38px}
.cat-card .stat{display:flex;align-items:baseline;gap:8px}
.cat-card .stat b{font-family:var(--mono);font-size:30px;font-weight:600}
.cat-card.furn .stat b{color:var(--furn)}
.cat-card.cons .stat b{color:var(--cons)}
.cat-card .stat span{color:var(--muted);font-size:12px}
.cat-card .go{position:absolute;right:22px;bottom:22px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;transition:.18s}
.cat-card.furn .go{background:var(--furn)}
.cat-card.cons .go{background:var(--cons)}
.cat-card:hover .go{transform:translateX(3px)}
.home-note{margin-top:22px;display:flex;align-items:center;gap:11px;font-size:12.5px;color:var(--muted);background:var(--brass-soft);border:1px solid #e6d4a8;border-radius:10px;padding:11px 15px;line-height:1.5}
.home-note b{color:var(--brass)}

/* 뷰헤더 */
.view-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.view-head .ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff}
.view-head.furn .ico{background:var(--furn)}
.view-head.cons .ico{background:var(--cons)}
.view-head h2{font-size:19px;margin:0}
.view-head h2 .en{font-size:14px;margin-left:7px}
.view-head p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}

/* 검색 */
.searchbar{position:relative;margin-bottom:14px}
.searchbar input{width:100%;border:1.5px solid var(--line-strong);background:var(--card);border-radius:11px;padding:14px 16px 14px 44px;font-size:15px;color:var(--ink);transition:.15s;box-shadow:var(--shadow-sm)}
.searchbar input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(169,121,31,.13)}
.searchbar .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchbar .hint{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.chip{border:1px solid var(--line-strong);background:var(--card);color:var(--muted);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;transition:.13s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .en{font-size:10.5px;opacity:.75}
.chip.on .en{color:rgba(255,255,255,.75)}

/* 테이블 */
.res-meta{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.res-meta b{color:var(--ink);font-family:var(--mono)}
.tablewrap{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:var(--shadow-sm)}
.scroll-x{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:11px 14px;background:#FBFAF6;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#FBFAF6}
.sku{font-family:var(--mono);font-size:11.5px;color:var(--brass);font-weight:600}
.pname{font-weight:600;color:var(--ink)}
.pname .en{display:block;font-size:11.5px;font-weight:500;margin-top:1px}
.pspec{color:var(--muted);font-size:11.5px;margin-top:2px}
.cls-tag{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--furn-soft);color:var(--furn);white-space:nowrap}
.cls-tag.cons{background:var(--cons-soft);color:var(--cons)}
.cls-tag .en{font-weight:500;opacity:.8}
.fursys-list{display:flex;gap:5px;flex-wrap:wrap;max-width:260px}
.fursys-pill{font-size:11px;font-family:var(--mono);font-weight:500;background:#F1EFE8;border:1px solid var(--line);color:var(--ink-soft);padding:2px 8px;border-radius:6px}
.fursys-pill em{font-style:normal;color:var(--brass);font-weight:600}
.price{font-family:var(--mono);font-weight:600;color:var(--ink);white-space:nowrap}
.cost{font-family:var(--mono);font-weight:600;white-space:nowrap}
.cost.hidden{display:inline-block;color:transparent;user-select:none;position:relative;background:repeating-linear-gradient(90deg,var(--ink) 0 8px,#33415f 8px 16px);border-radius:4px;min-width:58px;height:15px;vertical-align:middle}
.cost.hidden::after{content:"기밀";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.1em}
.cost.shown{color:var(--danger)}

/* 썸네일 (누끼 이미지 = contain, 밝은 카드) */
.thumb{position:relative;width:48px;height:48px;border-radius:9px;overflow:hidden;background:linear-gradient(160deg,#FBFAF7,#F1EFE8);border:1px solid var(--line);flex:none;display:grid;place-items:center}
.thumb.lg{width:100%;height:230px;border-radius:0}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px}
.thumb.lg img{padding:22px}
.thumb .fb{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted)}
.thumb.lg .fb{font-size:15px}
.prow{display:flex;align-items:center;gap:12px}

.addbtn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:8px;white-space:nowrap;transition:.13s;display:inline-flex;align-items:center;gap:6px}
.add-chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.chip-add{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:20px;white-space:nowrap;cursor:pointer;transition:.13s}
.chip-add:hover{border-color:var(--brass);color:var(--brass)}
.chip-add.on{background:var(--furn);border-color:var(--furn);color:#fff}
.chip-add.on:hover{color:#fff;filter:brightness(1.05)}
.addbtn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.addbtn.added{background:var(--furn);border-color:var(--furn);color:#fff}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty svg{opacity:.4;margin-bottom:12px}
.empty p{margin:0;font-size:14px}
.empty small{display:block;margin-top:6px;font-size:12px}

/* 장바구니 */
.quote-grid{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
@media(max-width:900px){.quote-grid{grid-template-columns:1fr}}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.qty button{border:none;background:var(--card);width:28px;height:30px;font-size:15px;color:var(--ink);line-height:1}
.qty button:hover{background:var(--brass-soft)}
.qty input{width:40px;height:30px;border:none;text-align:center;font-family:var(--mono);font-size:13px;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.qty input:focus{outline:none;background:#FBFAF6}
.pr-input{width:92px;font-family:var(--mono);font-size:13px;text-align:right;padding:6px 9px;border:1px solid var(--line-strong);border-radius:7px;font-weight:600}
.clr-input{width:96px;font-size:12.5px;padding:6px 9px;border:1px solid var(--line-strong);border-radius:7px}
.clr-input:focus{outline:none;border-color:var(--brass)}
.pr-input:focus{outline:none;border-color:var(--brass)}
.mgpct{font-family:var(--mono);font-size:12px;font-weight:600}
.mgpct.pos{color:var(--furn)}.mgpct.neg{color:var(--danger)}
.rm{border:none;background:transparent;color:var(--muted);padding:5px;border-radius:6px;line-height:0}
.rm:hover{color:var(--danger);background:var(--danger-soft)}

.sumcard{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);position:sticky;top:82px;overflow:hidden}
.sc-head{padding:16px 18px;border-bottom:1px solid var(--line);background:#FBFAF6}
.sc-head h3{margin:0;font-size:14px}.sc-head h3 .en{font-size:12px}
.sc-head p{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.sc-body{padding:16px 18px}
.sc-field{margin-bottom:12px}
.sc-field label{display:block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.sc-field input{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:13px}
.sc-field input:focus{outline:none;border-color:var(--brass)}
.sc-line{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13px}
.sc-line span{color:var(--muted)}
.sc-line b{font-family:var(--mono);font-weight:600}
.sc-cbm b{color:var(--cons)}
.sc-total{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:12px}
.sc-total span{font-weight:700;color:var(--ink);font-size:14px}
.sc-total b{font-size:19px;color:var(--brass)}
.sc-locked{padding:13px 18px;background:var(--danger-soft);border-top:1px solid #e6c9c2;font-size:11.5px;color:var(--danger);display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.btn-primary{width:100%;margin-top:14px;border:none;background:var(--ink);color:#fff;padding:12px;border-radius:10px;font-size:13.5px;font-weight:700;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary:hover{background:var(--brass);box-shadow:0 6px 18px rgba(169,121,31,.28)}
.btn-ghost{width:100%;margin-top:8px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);padding:10px;border-radius:10px;font-size:12.5px;font-weight:600}
.btn-ghost:hover{color:var(--danger);border-color:var(--danger)}

/* 관리자 DB */
.admin-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.adm-search{flex:1;min-width:200px;border:1px solid var(--line-strong);background:var(--card);border-radius:9px;padding:9px 13px;font-size:13px;color:var(--ink)}
.adm-search:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(169,121,31,.13)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:transparent;padding:8px 15px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.mini-btn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);font-weight:600;font-size:12.5px;padding:8px 13px;border-radius:9px;display:inline-flex;gap:7px;align-items:center}
.mini-btn:hover{border-color:var(--brass);color:var(--brass)}
.mini-add{margin-left:auto;border:1px solid var(--brass);background:var(--brass-soft);color:var(--brass);font-weight:700}
.mini-add:hover{background:var(--brass);color:#fff}
.admin-note{font-size:12px;color:var(--danger);background:var(--danger-soft);border:1px solid #e6c9c2;border-radius:9px;padding:9px 13px;margin-bottom:14px;display:flex;gap:8px;align-items:center}
.db-table td{padding:8px 10px;vertical-align:middle}
.db-table .cell-spec{max-width:210px;font-size:12px;color:var(--muted);white-space:normal;line-height:1.4}
.db-table .cell-att{min-width:150px;max-width:260px}
.db-table .cell-att .att-chips{gap:5px}
.db-table .cell-att .att-chip{font-size:11px;padding:3px 7px}

/* 컴팩트 관리자 표 (가로 스크롤 없음) */
.db-table2{table-layout:fixed;width:100%;border-collapse:collapse}
.db-table2 th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);padding:10px 8px;background:#FBFAF6;border-bottom:1px solid var(--line);white-space:nowrap}
.db-table2 td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:12px}
.db-table2 tbody tr:hover{background:#FBFAF6}
.db-table2 tbody tr.selrow{background:var(--brass-soft)}
.db-table2 .c-sel{width:30px;text-align:center;vertical-align:middle}
.db-table2 .c-sel input{width:15px;height:15px;accent-color:var(--brass);cursor:pointer}
.db-table2 col, .db-table2 .c-dim{width:58px}
.db-table2 th.c-dim,.db-table2 td.c-dim{width:56px;text-align:center;color:var(--muted);font-size:10.5px;line-height:1.5}
.db-table2 th.c-price,.db-table2 td.c-price{width:104px}
.db-table2 th.c-files,.db-table2 td.c-files{width:112px}
.db-table2 th.c-act,.db-table2 td.c-act{width:96px;text-align:right;white-space:nowrap}
/* 제품 셀 */
.c-prod{width:23%}
.c-prod .prow{gap:9px;align-items:flex-start}
.c-prod .thumb{width:42px;height:42px;flex:none}
.pmini{min-width:0;flex:1}
.pmini .pname{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.pmini .en{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmini .sku{font-family:var(--mono);font-size:10.5px;color:var(--brass);font-weight:600;margin-top:1px}
.pmini .cls-tag{display:inline-block;margin-top:4px;font-size:9.5px;padding:2px 6px}
/* 정보 셀 */
.c-info{width:30%}
.c-info .ci-sup{font-size:11.5px;color:var(--ink-soft);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-info .ci-url{font-size:11px;margin-bottom:3px}
.c-info .ci-url a{color:var(--cons);font-weight:600;text-decoration:none}
.c-info .ci-url a:hover{text-decoration:underline}
.c-info .ci-spec{font-size:11px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:4px}
.c-info .ci-fursys{display:flex;flex-wrap:wrap;gap:4px}
.c-info .fursys-pill{font-size:10px;padding:2px 6px}
/* 가격 셀 */
.c-price .pr-cost{font-family:var(--mono);font-size:10.5px;color:var(--danger)}
.c-price .pr-mg{font-family:var(--mono);font-size:10.5px;color:var(--furn)}
.c-price .pr-sell{font-family:var(--mono);font-weight:700;font-size:13.5px;color:var(--ink);margin-top:1px}
/* 첨부 셀 */
.c-files .fl-row{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:3px}
.c-files .fl-t{font-size:11px}
.c-files .att-chip{padding:3px 6px;font-size:11px;gap:0}

}
.icell{width:100%;min-width:80px;border:1px solid transparent;background:transparent;padding:6px 8px;border-radius:6px;font-size:12.5px;font-family:inherit}

/* 모달 공통 */
.modal-bg{position:fixed;inset:0;background:rgba(22,35,59,.44);backdrop-filter:blur(3px);z-index:100;display:grid;place-items:center;padding:20px}
.sq-list{max-height:52vh;overflow:auto;padding:2px 22px}
.sq-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.sq-row:last-child{border-bottom:none}
.sq-info{display:flex;flex-direction:column;gap:2px;min-width:0}
.sq-info b{font-family:var(--mono);font-size:13px;color:var(--ink)}
.sq-info span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}

.sq-btns{display:flex;gap:6px;flex:none;align-items:center}

.modal{background:var(--card);border-radius:16px;box-shadow:0 30px 70px rgba(22,35,59,.35);width:340px;max-width:100%;overflow:hidden;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal .m-head{padding:22px 22px 8px}

.pin-in{margin:16px 22px 4px;width:calc(100% - 44px);border:1.5px solid var(--line-strong);border-radius:10px;padding:13px;font-family:var(--mono);font-size:20px;text-align:center;letter-spacing:.3em}

.pin-err{color:var(--danger);font-size:12px;margin:8px 22px 0;min-height:16px;text-align:center;font-weight:600}
.m-actions{display:flex;gap:9px;padding:14px 22px 20px}
.m-actions button{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;border:none}
.m-cancel{background:#F1EFE8;color:var(--ink-soft)}
.m-ok{background:var(--ink);color:#fff}
.m-ok:hover{background:var(--brass)}

/* 제품 팝업 */
.pmodal{width:460px}
.pm-close{position:absolute;top:12px;right:12px;z-index:3;width:32px;height:32px;border-radius:8px;border:none;background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow-sm)}
.pm-close:hover{background:#fff}
.pm-imgwrap{position:relative;background:linear-gradient(160deg,#FBFAF7,#EEEBE1)}

.pm-spec{font-size:12.5px;color:var(--muted);margin:10px 0 4px;line-height:1.5;white-space:pre-wrap}

/* 컬러 옵션 */
.fm-colors .color-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.swatch{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px;background:#FBFAF6;font-size:12px;font-weight:600}

.swatch.view{padding:3px 12px 3px 3px}
.swatch.pick{cursor:pointer;transition:.13s}
.swatch.pick:hover{border-color:var(--brass)}
.swatch.pick.sel{border-color:var(--ink);background:var(--ink);box-shadow:0 0 0 2px rgba(22,35,59,.12)}
.swatch.pick.sel .sw-name{color:#fff}
.color-picker{margin-top:8px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#FBFAF6}
.cp-sec{margin-bottom:12px}
.cp-sec:last-child{margin-bottom:0}
.cp-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-bottom:7px}
.cp-lib{display:flex;flex-wrap:wrap;gap:7px}
.lib-color{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--card);border-radius:20px;padding:3px 11px 3px 3px;font-size:12px;font-weight:600;color:var(--ink)}

.lib-color .sw-img{width:24px;height:24px;border-radius:50%;overflow:hidden;flex:none;background:#ddd}
.lib-color .sw-img img{width:100%;height:100%;object-fit:cover}
.cp-new-row{display:flex;gap:12px;align-items:stretch}
.cp-paste{margin:0;min-width:120px;min-height:96px;flex:none}
.cp-paste .pz-inner{padding:10px}
.cp-paste .pz-inner b{font-size:12px}
.cp-paste.has-img{padding:0}
.cp-paste.has-img img{max-width:100%;max-height:92px;object-fit:contain;padding:6px}
.cp-new-fields{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center}
.cp-new-fields input{border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;font-size:13px}
.cp-new-fields input:focus{outline:none;border-color:var(--brass)}
/* 팝업 컬러 */
.pm-colors{margin:12px 0 4px}
.pm-colors>label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.pm-colors .sw-row{display:flex;flex-wrap:wrap;gap:8px}
/* 관리자 표 미니 스와치 */
.ci-colors{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}

.sw-mini img{width:100%;height:100%;object-fit:cover}
.pm-fursys{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
/* 퍼시스 편집기 (모델 + 가격) */
.fursys-editor{display:flex;flex-direction:column;gap:7px}

.fe-price .fe-cur{font-size:10.5px;font-weight:700;color:var(--muted);padding:0 8px;border-left:1px solid var(--line);background:#FBFAF6}
.fe-rm{border:none;background:transparent;color:var(--muted);padding:5px;border-radius:6px;line-height:0}
.fe-rm:hover{color:var(--danger);background:var(--danger-soft)}
.fursys-pill .fp-price{color:var(--brass);font-family:var(--mono);font-weight:700}
/* 가격 비교표 */
.pm-cmp{margin:14px 0 4px}
.pm-cmp>label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--brass);margin-bottom:7px}
.cmp-tbl{width:100%;border-collapse:collapse;font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cmp-tbl th{background:#FBFAF6;text-align:left;padding:7px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:1px solid var(--line)}
.cmp-tbl td{padding:7px 9px;border-bottom:1px solid var(--line)}
.cmp-tbl tr:last-child td{border-bottom:none}
.cmp-tbl .r{text-align:right;font-family:var(--mono)}
.cmp-tbl .save-pos{color:var(--furn);font-weight:700}
.cmp-tbl .save-neg{color:var(--danger);font-weight:700}
.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.fact{background:#FBFAF6;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.fact label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
.fact b{font-family:var(--mono);font-size:15px;font-weight:600}

.fact.cost b{color:var(--danger)}
.pm-foot{display:flex;align-items:center;gap:12px;margin-top:18px}

.pm-add:hover{background:var(--brass)}

/* 이미지 붙여넣기 다이얼로그 */
.imodal{width:440px}
.im-head{padding:18px 20px 6px}
.im-head h3{margin:0;font-size:16px}.im-head h3 .en{font-size:12.5px}
.im-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.pastezone{margin:14px 20px;border:2px dashed var(--line-strong);border-radius:14px;min-height:170px;display:grid;place-items:center;text-align:center;color:var(--muted);cursor:pointer;transition:.15s;position:relative;background:linear-gradient(160deg,#FBFAF7,#F1EFE8);outline:none}
.pastezone:focus,.pastezone.drag{border-color:var(--brass);background:var(--brass-soft);color:var(--brass)}
.pastezone .pz-inner{padding:20px}
.pastezone svg{opacity:.5;margin-bottom:8px}
.pastezone b{display:block;font-size:14px;color:var(--ink);margin-bottom:3px}
.pastezone.has-img{border-style:solid;border-color:var(--line);padding:0}
.pastezone.has-img img{max-width:100%;max-height:220px;object-fit:contain;padding:14px}
.pz-busy{position:absolute;inset:0;background:rgba(255,255,255,.86);display:grid;place-items:center;font-weight:600;color:var(--brass);font-size:13px}
.im-opts{display:flex;align-items:center;gap:10px;padding:2px 20px 4px;font-size:12.5px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.toggle input{display:none}
.toggle .tk{width:38px;height:22px;border-radius:20px;background:var(--line-strong);position:relative;transition:.15s}
.toggle .tk::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle input:checked+.tk{background:var(--furn)}
.toggle input:checked+.tk::after{transform:translateX(16px)}
.im-msg{padding:2px 20px;font-size:11.5px;color:var(--muted);min-height:16px}
.im-msg.warn{color:var(--danger)}
.im-actions{display:flex;gap:9px;padding:12px 20px 18px}
.im-actions button{padding:11px;border-radius:10px;font-size:13px;font-weight:700;border:none}
.im-del{background:var(--danger-soft);color:var(--danger);padding:11px 14px}
.im-cancel{background:#F1EFE8;color:var(--ink-soft);margin-left:auto;padding:11px 16px}
.im-save{background:var(--ink);color:#fff;padding:11px 20px}
.im-save:hover{background:var(--brass)}
.im-save:disabled{background:var(--line-strong);color:var(--muted);cursor:not-allowed}

/* 등록/편집 폼 모달 */
.fm-cat-sel{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}

.fp-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}

.fp-head h2 .en{font-size:13px;color:var(--muted);margin-left:7px;font-weight:500}
.fp-back{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-soft);font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:9px}
.fp-back:hover{border-color:var(--brass);color:var(--brass)}
.fp-card{max-width:760px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:22px}
.fp-foot{max-width:760px;display:flex;gap:9px;margin-top:16px;position:sticky;bottom:14px;background:var(--surface);padding:12px;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-sm)}
.fp-foot .im-cancel{margin-left:auto}
.fp-foot button{padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:700;border:none}
.fp-card .fm-f textarea{border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;resize:vertical;min-height:96px;line-height:1.5}
.fp-card .fm-f textarea:focus{outline:none;border-color:var(--brass)}
.cost-row{display:flex;gap:7px}
.cost-row input{flex:1;border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;font-size:13px;font-family:var(--mono);color:var(--danger)}

.cost-row select{width:78px;border:1px solid var(--line-strong);border-radius:8px;padding:0 8px;font-size:12.5px;font-weight:600;background:var(--card)}
.fm-cat-sel>label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.fm-seg button{padding:8px 18px}
.fmodal{width:560px;max-width:96vw;max-height:92vh;display:flex;flex-direction:column}
.fm-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.fm-head h3{margin:0;font-size:16px}.fm-head .en{font-size:12px;color:var(--muted);font-weight:500}
.fm-head .pm-close{position:static;box-shadow:none;border:1px solid var(--line)}
.fm-body{padding:16px 20px;overflow-y:auto}
.fm-photo{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}

.fm-f input,.fm-f select{border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit}

.fm-mini{border:1px solid var(--line-strong);background:var(--brass-soft);color:var(--brass);font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px}

.att-list{display:flex;flex-direction:column;gap:7px}
.att-empty{font-size:12px;color:var(--muted);padding:9px;text-align:center;border:1px dashed var(--line-strong);border-radius:8px}

a.att-name:hover{color:var(--brass);text-decoration:underline}
.att-size{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}

/* 토스트 */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(22,35,59,.3);z-index:120;transition:.25s;display:flex;gap:9px;align-items:center;pointer-events:none;max-width:90vw}

.toast .tk{color:var(--brass-hi)}

/* 견적서 인쇄 */
.quote-sheet{display:none}
@media print{
  .no-print{display:none !important}
  body{background:#fff}
  .inv-sign .stamp{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .quote-sheet{display:block !important}
  @page{margin:12mm}
  .inv-head,.inv-parties,.inv-party,.inv-sum,.inv-pay,.inv-notes,.inv-sign,.qs-head,.qs-tot,.qs-foot{break-inside:avoid;page-break-inside:avoid}
  .inv-table thead,.qs-table thead{display:table-header-group}
  .inv-table tr,.qs-table tr{break-inside:avoid;page-break-inside:avoid}
}
.qs-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:18px}
.qs-co{font-family:var(--mono);font-weight:600;letter-spacing:.12em;font-size:16px}
.qs-t{font-size:24px;font-weight:700;letter-spacing:.05em;text-align:right}
.qs-meta{font-size:12px;color:#666;text-align:right;line-height:1.7;margin-top:4px}
.qs-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:16px}
.qs-table th{background:#F4F2EC;text-align:left;padding:8px 9px;border-bottom:1.5px solid var(--ink);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.qs-table td{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
.qs-table .r{text-align:right;font-family:var(--mono)}
.qs-img{width:44px;height:44px;border:1px solid var(--line);border-radius:6px;background:#FBFAF7;display:grid;place-items:center;overflow:hidden}
.qs-img img{width:100%;height:100%;object-fit:contain;padding:3px}
.qs-tot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.qs-cbm{font-size:11px;color:#666;line-height:1.6}
.qs-cbm b{font-family:var(--mono);color:var(--ink)}
.qs-tot table{border-collapse:collapse;font-size:13px;min-width:260px}
.qs-tot td{padding:6px 12px}
.qs-tot .g td{border-top:2px solid var(--ink);font-weight:700;font-size:16px;padding-top:10px}
.qs-tot .r{text-align:right;font-family:var(--mono)}
.qs-foot{margin-top:22px;font-size:10.5px;color:#666;border-top:1px solid var(--line);padding-top:12px;line-height:1.6}
/* 인보이스 인쇄 (#quoteSheet 내부, 인쇄시만 표시) */
.inv-head{display:flex;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
.inv-co{font-family:var(--mono);font-weight:600;letter-spacing:.06em;font-size:14.5px}
.inv-co small{display:block;font-family:var(--ui);font-weight:400;font-size:10px;color:#666;letter-spacing:0;margin-top:3px;line-height:1.5}
.inv-title{font-size:19px;font-weight:700;letter-spacing:.03em;text-align:right}
.inv-title em{display:block;font-size:11px;font-weight:400;color:#888;font-style:italic}
.inv-meta{display:grid;grid-template-columns:1fr 1fr;gap:2px 22px;font-size:10.5px;margin-bottom:12px}
.inv-meta .m{display:flex;justify-content:space-between;border-bottom:1px dotted #ccc;padding:2px 0}
.inv-meta .m span{color:#888}
.inv-meta .m b{font-family:var(--mono)}
.inv-parties{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;margin-bottom:12px}
.inv-party{border:1px solid var(--line-strong);padding:9px 11px;background:#FBFAF7;vertical-align:top;width:49%}
.inv-gap{width:2%;border:0;background:none;padding:0}
.inv-party h4{margin:0 0 4px;font-size:9.5px;letter-spacing:.05em;color:var(--brass);font-weight:600}
.inv-party .nm{font-weight:600;font-size:12px}
.inv-party .dt{font-size:10px;color:#555;line-height:1.6;margin-top:2px}
.inv-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:12px}
.inv-table th{background:#F4F2EC;text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--ink);font-size:9.5px;text-transform:uppercase;letter-spacing:.02em}
.inv-table th small{display:block;color:#999;font-weight:400;text-transform:none;letter-spacing:0}
.inv-table td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.inv-table .r{text-align:right;font-family:var(--mono)}
.inv-sum{width:100%;border-collapse:collapse;table-layout:fixed;margin-bottom:12px}
.inv-words{width:55%;vertical-align:top;font-size:10px;color:#555;padding:2px 16px 0 0;line-height:1.5}
.inv-words b{color:#111}
.inv-totcell{width:45%;vertical-align:top;padding:0}
.inv-tot{width:100%;border-collapse:collapse;font-size:12px}
.inv-tot td{padding:4px 10px}
.inv-tot .g td{border-top:2px solid var(--ink);font-weight:700;font-size:14px;padding-top:7px}
.inv-tot .r{text-align:right;font-family:var(--mono)}
.inv-pay{border:1px solid var(--line-strong);padding:8px 11px;background:#FBFAF7;font-size:10px;color:#555;line-height:1.65;margin-bottom:12px}
.inv-pay b{color:#111}
.inv-notes{font-size:9.5px;color:#666;line-height:1.55;margin-bottom:14px}
.inv-notes b{color:#111;font-weight:600}
.inv-notes .vi{font-style:italic;color:#888}
.inv-sign{border:1px solid var(--ink);padding:10px 14px;width:380px;max-width:74%}
.inv-sign h5{margin:0;font-size:10px;font-weight:600}
.inv-sign .vi{font-size:9px;color:#888;font-style:italic;margin-bottom:2px}
.inv-sign .sigwrap{position:relative;height:134px;margin:2px 0}
.inv-sign .stamp{position:absolute;left:12px;top:0;height:130px;z-index:2;mix-blend-mode:multiply}
.inv-sign .sig{position:absolute;left:49px;top:33px;height:64px;z-index:1}
.inv-sign .sigline{border-top:1px solid #333;padding-top:3px;font-size:9.5px;line-height:1.55}
/* 문서종류 토글 (화면 UI) */
.doc-toggle{display:flex;gap:6px;padding:14px 18px 4px}
.dt-btn{flex:1;border:1px solid var(--line-strong);background:var(--card);color:var(--muted);font-size:12.5px;font-weight:600;padding:8px;border-radius:8px;cursor:pointer;transition:.15s}
.dt-btn:hover{border-color:var(--brass);color:var(--brass)}
.dt-btn .en{font-weight:500;font-size:10.5px}
.dt-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dt-btn.on:hover{color:#fff}
.inv-emisor{font-size:11px;color:var(--muted);padding:2px 0 8px;line-height:1.5;border-bottom:1px solid var(--line);margin-bottom:10px}
.inv-emisor b{color:var(--ink)}
.sc-field textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;resize:vertical;box-sizing:border-box}
.sc-field select{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font:inherit;font-size:12.5px;background:var(--card);color:var(--ink);box-sizing:border-box}

/* 동기화 상태 칩 */
.syncchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:7px 11px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);color:var(--muted);white-space:nowrap}
.syncchip .sd{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.syncchip.online{color:var(--furn);border-color:#bfe0d3;background:var(--furn-soft)}
.syncchip.online .sd{background:var(--furn)}
.syncchip.connecting{color:var(--brass);border-color:#e6d4a8;background:var(--brass-soft)}
.syncchip.connecting .sd{background:var(--brass);animation:pulse 1s infinite}
.syncchip.local{color:var(--danger);border-color:#e6c9c2;background:var(--danger-soft)}
.syncchip.local .sd{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.fb-banner{max-width:1160px;margin:14px auto -8px;padding:11px 16px;border:1px solid #e6d4a8;background:var(--brass-soft);color:var(--brass);border-radius:10px;font-size:12.5px;line-height:1.5}
.fb-banner b{color:var(--danger)}
#fbBanner{padding:0 26px}
@media(max-width:640px){
  .cards{grid-template-columns:1fr}
  .wrap{padding:20px 16px 80px}
  .nav{padding:0 16px}
  #fbBanner{padding:0 16px}
  .appbar{padding:12px 16px;gap:10px;flex-wrap:wrap}
  .brand .sub{display:none}
  .syncchip{font-size:10.5px;padding:6px 8px}
  .pmodal,.imodal,.fmodal{width:100%}
  .fm-grid{grid-template-columns:1fr}
}

function _liteState(){
  const o=Object.assign({},S);
  o.products=(S.products||[]).map(p=>{
    if(!p||typeof p!=="object") return p;
    const hasData = typeof p.img==="string" && /^data:/.test(p.img);
    const cols = Array.isArray(p.colors) ? p.colors : null;
    const stripCol = cols && cols.some(c=>c&&c.img&&c.id&&(S.colorLib||[]).some(x=>x.id===c.id));
    if(!hasData && !stripCol) return p;
    const q=Object.assign({},p);
    if(hasData) q.img="";
    if(stripCol) q.colors=cols.map(c=>(c&&c.img&&c.id&&(S.colorLib||[]).some(x=>x.id===c.id))?Object.assign({},c,{img:""}):c);
    return q;
  });
  return o;
}

function numWordsEN(n){n=Math.floor(n);if(n===0)return "zero";const g=["","thousand","million","billion"];let p=[],i=0;while(n>0){const c=n%1000;if(c)p.unshift(_enHundreds(c)+(g[i]?" "+g[i]:""));n=Math.floor(n/1000);i++;}return p.join(" ");}
function _viBelowThousand(n,lead){const d=["không","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"];const tr=Math.floor(n/100),ch=Math.floor((n%100)/10),dv=n%10;let s=[];if(tr>0||lead){s.push(d[tr]+" trăm");}if(ch>1){s.push(d[ch]+" mươi");if(dv===1)s.push("mốt");else if(dv===5)s.push("lăm");else if(dv>0)s.push(d[dv]);}else if(ch===1){s.push("mười");if(dv===5)s.push("lăm");else if(dv>0)s.push(d[dv]);}else{if(dv>0){if(tr>0||lead)s.push("lẻ "+d[dv]);else s.push(d[dv]);}}return s.join(" ").trim();}
function numWordsVI(n){n=Math.floor(n);if(n===0)return "không";const g=["","nghìn","triệu","tỷ"];let gr=[];while(n>0){gr.unshift(n%1000);n=Math.floor(n/1000);}const L=gr.length;let out=[];for(let i=0;i<L;i++){const v=gr[i],sc=L-1-i;if(v===0)continue;const lead=(i>0)&&(v<100);out.push(_viBelowThousand(v,lead)+(g[sc]?" "+g[sc]:""));}return out.join(" ").replace(/\s+/g," ").trim();}

/* ══════════ 저장 · 동기화 (전자결재 시스템과 동일 방식) ══════════
   Firebase SDK 없이 Realtime Database REST(.json)로 저장 — 기존 INICS v2와
   같은 프로젝트/규칙 사용(apiKey·인증 불필요). 소싱 데이터는 /inics_sourcing
   네임스페이스로 분리해 전자결재(/inics_approval)와 안 겹침. 사진은 제품에
   base64로 인라인 저장(기존 제품 DB와 동일). 실시간 반영은 REST 스트리밍(SSE).
   오프라인이면 자동 로컬 폴백 → 데이터 유실 방지.                          */
const DB_BASE = "https://inics-approval-default-rtdb.asia-southeast1.firebasedatabase.app";
const DB_ROOT = "/inics_sourcing";
const STORAGE_BUCKET = "inics-approval.firebasestorage.app";   // 전자결재와 동일 버킷
function dbURL(path){ return DB_BASE + DB_ROOT + path + ".json"; }
const NET = {on:false, es:null};

/* 첨부파일 → Firebase Storage REST 업로드 (기존 GRAB CSV 방식과 동일) */
function _safeName(s){ return String(s||"file").replace(/[\/\\:*?"<>|#\[\]]/g,"_").replace(/\s+/g,"_").slice(0,90); }
async function uploadAttachment(productId, file, folder){
  const path = "sourcing/"+(folder||"attachments")+"/"+productId+"/"+Date.now()+"_"+_safeName(file.name);
  const up = "https://firebasestorage.googleapis.com/v0/b/"+STORAGE_BUCKET+"/o?name="+encodeURIComponent(path);
  const r = await fetch(up,{method:"POST",headers:{"Content-Type":file.type||"application/octet-stream"},body:file});
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  const token = (j.downloadTokens||"").split(",")[0];
  const url = "https://firebasestorage.googleapis.com/v0/b/"+STORAGE_BUCKET+"/o/"+encodeURIComponent(path)+"?alt=media"+(token?("&token="+token):"");
  return {name:file.name, url, size:file.size||0, type:file.type||"", path, ts:Date.now()};
}
/* dataURL → Blob */
function _dataUrlToBlob(u){
  const m=/^data:([^;,]+)(;base64)?,/.exec(u||"");
  if(!m) return null;
  const mime=m[1], isB64=!!m[2], body=u.slice(m[0].length);
  if(!isB64) return new Blob([decodeURIComponent(body)],{type:mime});
  const bin=atob(body), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
/* base64 사진 → Storage 업로드 후 다운로드 URL 반환 */
async function uploadImgDataUrl(productId, dataUrl){
  const blob=_dataUrlToBlob(dataUrl);
  if(!blob) return dataUrl;
  const t=blob.type||"";
  const ext=/webp/.test(t)?"webp":/png/.test(t)?"png":"jpg";
  const file=new File([blob],"photo."+ext,{type:t||"image/jpeg"});
  const a=await uploadAttachment(productId,file,"photos");
  return a.url;
}
/* 저장 직전 호출: 사진이 base64면 Storage로 승격 */
async function promoteProductImg(p){
  if(!p||typeof p.img!=="string"||!/^data:/.test(p.img)) return false;

  try{ p.img=await uploadImgDataUrl(p.id,p.img); return true; }
  catch(e){ console.warn("사진 업로드 실패",e); toast("사진 업로드 실패 — 임시 저장 / Upload failed"); return false; }
}
/* 기존 base64 사진 일괄 이전 (1회) · 콘솔에서 migrateImages(true) 로 재실행 */
async function migrateImages(force){
  const MK="inics_sourcing_imgmig_v1";
  if(!NET.on) return 0;
  if(!force){ try{ if(localStorage.getItem(MK)) return 0; }catch(e){} }
  const targets=(S.products||[]).filter(p=>typeof p.img==="string"&&/^data:/.test(p.img));
  if(!targets.length){ try{ localStorage.setItem(MK,"1"); }catch(e){} return 0; }
  toast("사진 "+targets.length+"건 클라우드 이전 중… / Migrating…");
  let n=0;
  for(const p of targets){
    try{ p.img=await uploadImgDataUrl(p.id,p.img); pushProduct(p); n++; }
    catch(e){ console.warn("이전 실패",p.sku,e); }
  }
  persist(); render();
  try{ localStorage.setItem(MK,"1"); }catch(e){}
  toast("사진 "+n+"건 이전 완료 / "+n+" migrated");
  return n;
}

/* 실시간 동기화 (Firebase REST 스트리밍 · EventSource) */
function subscribeProducts(){
  try{
    const es=new EventSource(dbURL("/products"));
    const apply=ev=>{
      let msg; try{ msg=JSON.parse(ev.data); }catch(e){ return; }
      if(!msg) return;
      if(document.querySelector(".modal-bg")) return;                 // 편집 중 스킵
      const ae=document.activeElement;
      if(ae && ["INPUT","SELECT","TEXTAREA"].includes(ae.tagName)) return;
      const path=msg.path, data=msg.data;
      if(path==="/"){ S.products = data ? Object.values(data) : []; }
      else {
        const parts=String(path).replace(/^\//,"").split("/"), id=parts[0];
        if(parts.length===1){
          if(data==null){ S.products=S.products.filter(p=>p.id!==id); }
          else { const i=S.products.findIndex(p=>p.id===id); if(i>=0)S.products[i]=data; else S.products.push(data); }
        } else { const p=byId(id); if(p && data!==undefined) p[parts[1]]=data; }
      }
      normalizeProducts(); persist(); render();
    };
    es.addEventListener("put",apply);
    es.addEventListener("patch",apply);
    NET.es=es;
  }catch(e){ /* EventSource 미지원 브라우저는 스트리밍 없이 동작 */ }
}

function render(){
  renderNav();renderLock();
  document.getElementById("curSel").value=S.currency;
  const app=document.getElementById("app");
  if(view!=="form") leaveForm();
  if(view==="home") app.innerHTML=viewHome();
  else if(view==="furniture"||view==="consumable"){app.innerHTML=viewSearch(view);mountSearch(view);}
  else if(view==="cart") app.innerHTML=viewCart();
  else if(view==="admin") { app.innerHTML=viewAdmin(); mountAdminSearch(); updateBulkBar(); }
  else if(view==="form"){ app.innerHTML=viewForm(); mountForm(); }
}
function renderNav(){
  const cc=cartCount();
  const tab=(id,ko,en,extra="")=>`<button class="tab ${view===id?"active":""} ${extra}" data-nav="${id}">${ko} <small class="en">${en}</small></button>`;
  let h=tab("home","홈","Home")+tab("furniture","가구","Furniture")+tab("consumable","소모품","Consumables");
  h+=`<button class="tab ${view==="cart"?"active":""}" data-nav="cart">${I.cart} 견적 <small class="en">Quote</small>${cc?`<span class="badge">${cc}</span>`:""}</button>`;
  if(unlocked) h+=tab("admin","관리자 DB","Admin","admin");
  document.getElementById("nav").innerHTML=h;
}
function renderLock(){
  const b=document.getElementById("lockBtn"),l=document.getElementById("lockLabel");
  if(unlocked){b.classList.add("on");l.textContent="관리자 모드 · 잠그기 / Lock";}
  else{b.classList.remove("on");l.textContent="원가 보기 · 관리자 / Cost";}
}

/* 검색 */
function viewSearch(cat){
  const meta = cat==="furniture"
    ? {cls:"furn",ico:I.chair,title:"가구 검색",en:"Furniture Search",sub:"퍼시스 모델명·코드(예: CH4100, 리플라이) 또는 제품명 / Search by Fursys model or product name",ph:"퍼시스 모델·제품명 검색 / Search…  (CH4100 · 인에이블 · 중역)"}
    : {cls:"cons",ico:I.box,title:"소모품 검색",en:"Consumables Search",sub:"제품명·분류로 검색 / Search by name or category",ph:"소모품 검색 / Search…  (캐스터 · 가스실린더)"};
  const chips=clsChips(cat).map(c=>`<button class="chip ${filter[cat].cls===c?"on":""}" data-cls="${c}">${esc(c)}${c!=="전체"&&CLS_EN[c]?` <span class="en">${CLS_EN[c]}</span>`:""}</button>`).join("");
  return `
  <div class="view-head ${meta.cls}"><span class="ico">${meta.ico}</span>
    <div><h2>${meta.title}<span class="en">${meta.en}</span></h2><p>${meta.sub}</p></div></div>
  <div class="searchbar"><span class="si">${I.search}</span>
    <input id="searchInput" type="text" placeholder="${meta.ph}" value="${esc(filter[cat].q)}" autocomplete="off"/>
    ${cat==="furniture"?'<span class="hint">Fursys → INICS</span>':''}</div>
  <div class="chips">${chips}</div>
  <div id="results"></div>`;
}
function mountSearch(cat){const inp=document.getElementById("searchInput");renderResults(cat);inp.addEventListener("input",()=>{filter[cat].q=inp.value;renderResults(cat);});}
function matchProduct(p,f){
  if(f.cls!=="전체"&&p.cls!==f.cls)return false;
  const q=f.q.trim().toLowerCase();if(!q)return true;
  return [p.name,p.nameEn,p.sku,p.cls,clsEn(p.cls),p.spec,...((p.fursys||[]).map(x=>x.model||""))].join(" ").toLowerCase().includes(q);
}
function renderResults(cat){
  const f=filter[cat];
  const list=S.products.filter(p=>p.cat===cat&&matchProduct(p,f));
  const box=document.getElementById("results");
  if(!list.length){box.innerHTML=`<div class="tablewrap"><div class="empty">${I.search}<p>일치하는 품목이 없습니다. / No matching items.</p><small>검색어·필터를 바꿔보세요. / Adjust search or filter.</small></div></div>`;return;}
  const isFurn=cat==="furniture";
  const rows=list.map(p=>{
    const addCell=(p.colors&&p.colors.length)?`<div class="add-chips">${p.colors.map(c=>{const on=S.cart.some(l=>l.id===p.id&&(l.color||"")===c.name);return `<button class="chip-add ${on?"on":""}" data-addc="${p.id}" data-clr="${esc(c.name)}">${on?"✓":"+"} ${esc(c.name)}</button>`;}).join("")}</div>`:`<button class="addbtn ${S.cart.some(l=>l.id===p.id&&!l.color)?"added":""}" data-add="${p.id}">${S.cart.some(l=>l.id===p.id&&!l.color)?"✓ 담김":`${I.plus} 견적`}</button>`;
    const fursys=isFurn?`<div class="fursys-list">${(p.fursys||[]).map(x=>{const a=(x.model||"").split(" "),code=a.pop(),nm=a.join(" ");return `<span class="fursys-pill">${esc(nm)} <em>${esc(code)}</em></span>`;}).join("")||'<span class="pspec">— 매핑 없음 / none</span>'}</div>`:`<span class="pspec">${esc(p.unit)}</span>`;
    return `<tr class="clickable" data-open="${p.id}">
      <td><div class="prow">${thumb(p)}<div><div class="pname">${esc(p.name)}<span class="en">${esc(p.nameEn)}</span></div><div class="sku">${esc(p.sku)}</div></div></div></td>
      <td><span class="cls-tag ${isFurn?"":"cons"}">${esc(p.cls)} <span class="en">${clsEn(p.cls)}</span></span></td>
      <td>${fursys}</td>
      <td><span class="price">${fmt(p.price)}</span></td>
      <td style="text-align:right">${addCell}</td>
    </tr>`;
  }).join("");
  box.innerHTML=`
    <div class="res-meta"><b>${list.length}</b>건 · 행 클릭 시 상세 팝업 / Click a row for details</div>
    <div class="tablewrap scroll-x"><table><thead><tr>
      <th>제품 / Product</th><th>분류 / Category</th><th>${isFurn?"퍼시스 대체 모델 / Fursys Equiv.":"단위 / Unit"}</th><th>판가 (${PRICE_TERM}) / Price</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function saveQuote(){
  if(!S.cart.length){toast("담긴 품목이 없습니다 / Cart empty");return;}
  S.savedQuotes ||= [];
  const t=cartTotals();
  S.savedQuotes.unshift({no:S.quote.no||autoQuoteNo(),client:S.quote.client||"",date:new Date().toISOString(),currency:S.currency,total:t.sell,items:S.cart.map(l=>({id:l.id,qty:l.qty,price:l.price,color:l.color||""}))});
  if(S.savedQuotes.length>60)S.savedQuotes.length=60;
  S.quote.no=autoQuoteNo();
  persist();render();toast("견적 저장됨 / Quote saved");
}
function loadQuote(i){
  const q=(S.savedQuotes||[])[i];if(!q)return;
  S.cart=q.items.map(it=>({id:it.id,uid:newUid(it.id),qty:it.qty,price:it.price,color:it.color||""})).filter(l=>byId(l.id));
  S.quote.client=q.client||"";S.quote.no=q.no;if(q.currency)S.currency=q.currency;S.doc="quote";
  persist();document.querySelectorAll(".modal-bg").forEach(m=>m.remove());render();toast("견적 불러옴 / Quote loaded");
}
function delSavedQuote(i){ if(!S.savedQuotes)return; S.savedQuotes.splice(i,1); persist(); openSavedQuotes(); }
function openSavedQuotes(){
  document.querySelectorAll(".sq-modal").forEach(m=>m.remove());
  const list=S.savedQuotes||[];
  const rows=list.length?list.map((q,i)=>{
    const d=new Date(q.date).toLocaleDateString("ko-KR",{year:"2-digit",month:"2-digit",day:"2-digit"});
    return `<div class="sq-row"><div class="sq-info"><b>${esc(q.no)}</b><span>${esc(q.client||"—")} · ${q.items.length}품목 · ${fmt(q.total||0)}</span><small>${d}</small></div><div class="sq-btns"><button class="mini-btn" data-loadq="${i}">불러오기 / Load</button><button class="rm" data-delq="${i}" title="삭제 / delete">${I.trash}</button></div></div>`;
  }).join(""):`<div class="sq-empty">저장된 견적이 없습니다. / No saved quotes.</div>`;
  const bg=document.createElement("div");bg.className="modal-bg sq-modal";
  bg.innerHTML=`<div class="modal" style="width:470px;max-width:94vw"><div class="m-head" style="padding:20px 22px 10px"><h3>저장된 견적 <span class="en">/ Saved Quotes</span></h3><p>불러오면 현재 장바구니를 대체합니다. / Loading replaces the current cart.</p></div><div class="sq-list">${rows}</div><div class="m-actions"><button class="m-cancel" data-c>닫기 / Close</button></div></div>`;
  document.body.appendChild(bg);
  bg.querySelector("[data-c]").onclick=()=>bg.remove();
  bg.onclick=ev=>{if(ev.target===bg)bg.remove();};
  bg.addEventListener("click",ev=>{
    const lq=ev.target.closest("[data-loadq]");if(lq){loadQuote(+lq.dataset.loadq);return;}
    const dq=ev.target.closest("[data-delq]");if(dq){delSavedQuote(+dq.dataset.delq);return;}
  });
}

        ${costFacts}
      </div>
      ${(p.specFiles||[]).length?`<div class="pm-spec-dl"><label>📘 SPEC 다운로드 / Download</label><div class="att-chips">${p.specFiles.map(a=>`<a class="att-chip" href="${a.url}" target="_blank" rel="noopener" download>${fileIcon(a)} ${esc(a.name)}</a>`).join("")}</div></div>`:""}
      ${unlocked?`<div class="pm-sup">${p.supplier?`<div class="pm-suprow"><label>공급업체 / Supplier</label><b>${esc(p.supplier)}</b></div>`:""}${p.url?`<div class="pm-suprow"><label>🔒 제품 정보 / Info URL</label><a class="att-chip" href="${esc(p.url)}" target="_blank" rel="noopener">🔗 ${esc(p.url.replace(/^https?:\/\//,"").slice(0,40))}</a></div>`:""}${(p.attachments||[]).length?`<div class="pm-attrow"><label>🔒 기타 첨부 / Other (admin)</label><div class="att-chips">${p.attachments.map(a=>`<a class="att-chip" href="${a.url}" target="_blank" rel="noopener" download>${fileIcon(a)} ${esc(a.name)}</a>`).join("")}</div></div>`:""}</div>`:""}
      <div class="pm-foot">
        <div class="qty"><button data-pq="-1">−</button><input class="num" id="pmQty" value="1"/><button data-pq="1">+</button></div>
        <button class="pm-add" data-padd="${id}">${I.cart} ${inCart?"수량 추가 / Add more":"견적 담기 / Add to Quote"}</button>
      </div>
    </div>
  </div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  const qtyIn=bg.querySelector("#pmQty");
  let pmColor=(p.colors&&p.colors.length)?p.colors[0].name:"";
  bg.addEventListener("click",ev=>{
    if(ev.target===bg||ev.target.closest("[data-x]"))return close();
    const pq=ev.target.closest("[data-pq]");if(pq){qtyIn.value=Math.max(1,(parseInt(qtyIn.value)||1)+Number(pq.dataset.pq));return;}
    const sw=ev.target.closest("[data-pmcolor]");if(sw){pmColor=sw.dataset.pmcolor;bg.querySelectorAll(".swatch.pick").forEach(x=>x.classList.remove("sel"));sw.classList.add("sel");return;}
    const add=ev.target.closest("[data-padd]");if(add){const q=Math.max(1,parseInt(qtyIn.value)||1);const ex=S.cart.find(l=>l.id===id&&(l.color||"")===(pmColor||""));if(ex)ex.qty+=q;else S.cart.push({id,uid:newUid(id),qty:q,price:null,color:pmColor||""});persist();toast(`${p.nameEn||p.name}${pmColor?" · "+pmColor:""} ${q}개 담김 / added`);close();render();}
  });
  document.addEventListener("keydown",function esc2(ev){if(ev.key==="Escape"){close();document.removeEventListener("keydown",esc2);}});
}

/* ── 제품 등록/편집 (팝업 대신 페이지 뷰) ── */
let formCtx=null, _formPaste=null;
function leaveForm(){ if(_formPaste){ document.removeEventListener("paste",_formPaste); _formPaste=null; } }
const DEFAULT_FX = 25400;   // 기본 환율 1 USD = ? VND (편집 가능)

function openProductForm(id, catArg){
  const editing = !!id;
  const src = editing ? byId(id) : null;
  const f = editing
    ? JSON.parse(JSON.stringify(src))
    : {id:((catArg==="consumable")?"C":"F")+"_"+Date.now().toString(36), cat:(catArg||"furniture"), sku:"", name:"", nameEn:"", cls:"", spec:"", supplier:"", url:"", unit:"EA", cost:0, price:0, cbm:0, img:"", fursys:[], attachments:[], specFiles:[], colors:[], costCcy:"USD", costRaw:0, fx:DEFAULT_FX};
  f.attachments = f.attachments || []; f.fursys = f.fursys || []; f.specFiles = f.specFiles || []; f.url = f.url || ""; f.colors = f.colors || [];
  f.costCcy = f.costCcy || "USD"; f.fx = f.fx || DEFAULT_FX; f.costRaw = (f.costRaw!=null && f.costRaw!==0) ? f.costRaw : f.cost;
  if(!f.cls || !allCls(f.cat).includes(f.cls)) f.cls = allCls(f.cat)[0] || "기타";
  f._margin = (f.cost>0) ? Math.round(((f.price-f.cost)/f.cost*100)*10)/10 : DEFAULT_MARGIN;
  formCtx = {editing, f, rawImg:null};
  view="form"; render(); window.scrollTo({top:0,behavior:"smooth"});
}

  </div>
  <div class="fp-card">
    <div class="fm-cat-sel"><label>구분 / Type</label>

    <div class="fm-photo">

      <label class="toggle fm-rmbg"><input type="checkbox" id="fmRmbg" checked><span class="tk"></span></label><span class="fm-rmbg-t">배경 제거<br>Remove bg</span>
    </div>
    <div class="fm-grid">
      <div class="fm-f"><label>SKU</label><input id="f_sku" value="${esc(f.sku)}" placeholder="IX-CH-100"/></div>
      <div class="fm-f fm-wide"><label>분류 / Category <button class="fm-mini" id="f_addcls">+ 새 분류 / Add</button></label>
        <select id="f_cls">${clsOpts}</select>
        <div class="fm-clsadd" id="f_clsadd" style="display:none"><input id="f_clsnew" placeholder="새 분류 이름 / New category name"/><button class="mini-btn" id="f_clsok">추가 / Add</button><button class="mini-btn" id="f_clscancel">취소</button></div>
      </div>
      <div class="fm-f"><label>제품명 (한글) / Name KO</label><input id="f_name" value="${esc(f.name)}"/></div>
      <div class="fm-f"><label>Name (English)</label><input id="f_nameEn" value="${esc(f.nameEn)}"/></div>
      <div class="fm-f fm-wide"><label>공급업체 / Supplier</label><input id="f_supplier" value="${esc(f.supplier)}" placeholder="공급처 이름 / supplier name"/></div>
      <div class="fm-f fm-wide"><label>🔒 제품 정보 URL / Info URL <span class="fm-hint">관리자만 표시 / admin only</span></label><input id="f_url" value="${esc(f.url)}" placeholder="https:// 제품 페이지·카탈로그 링크"/></div>
      <div class="fm-f fm-wide"><label>스펙 / Spec <span class="fm-hint">여러 줄 입력 가능 / multi-line</span></label><textarea id="f_spec" rows="5" placeholder="치수·재질·색상·옵션 등">${esc(f.spec)}</textarea></div>
      ${isFurn?`<div class="fm-f fm-wide fm-fursys"><label>퍼시스 대체 모델 / Fursys Equivalent <span class="fm-hint">모델명 + 퍼시스 가격(USD) / model + Fursys price</span> <button class="fm-mini" id="f_fursysadd">+ 추가 / Add</button></label><div id="fmFursysList" class="fursys-editor"></div></div>`:``}
      <div class="fm-f"><label>단위 / Unit</label><input id="f_unit" value="${esc(f.unit)}"/></div>
      <div class="fm-f"><label>CBM (m³)</label><input id="f_cbm" class="num" value="${f.cbm}"/></div>
      <div class="fm-f"><label>원가 / Cost</label><div class="cost-row"><input id="f_costraw" class="num" value="${f.costRaw}"/><select id="f_costccy"><option value="USD" ${!isVND?"selected":""}>USD</option><option value="VND" ${isVND?"selected":""}>VND</option></select></div></div>
      <div class="fm-f" id="fxwrap" style="display:${isVND?"block":"none"}"><label>환율 / FX <span class="fm-hint">1 USD = ? VND</span></label><input id="f_fx" class="num" value="${f.fx}"/></div>
      <div class="fm-f"><label>원가 (USD) / Cost USD <span class="fm-hint">자동 환산</span></label><input id="f_costusd" class="num" value="${f.cost}" readonly style="color:var(--danger);background:#FBFAF6"/></div>
      <div class="fm-f"><label>마진율 / Margin (%)</label><input id="f_margin" class="num" value="${f._margin}"/></div>
      <div class="fm-f fm-wide"><label>판가 (USD · ${PRICE_TERM}) / Price <span class="fm-hint">원가(USD)×(1+마진) · 직접 수정 가능</span></label><input id="f_price" class="num" value="${f.price}" style="font-weight:700"/></div>
    </div>
    <div class="fm-att">
      <div class="fm-att-head"><label>📘 SPEC 첨부 <span class="en">/ Spec files — 제품 클릭 시 누구나 다운로드</span></label><button class="mini-btn" id="fmSpecAdd">${I.plus} SPEC 추가 / Add</button></div>
      <div id="fmSpecList" class="att-list"></div>
    </div>
    <div class="fm-att">
      <div class="fm-att-head"><label>🔒 기타 첨부 <span class="en">/ Other files — 관리자만 열람 (견적서 등)</span></label><button class="mini-btn" id="fmAddFile">${I.plus} 파일 추가 / Add</button></div>
      <div id="fmAttList" class="att-list"></div>
    </div>
    <div class="fm-att fm-colors">
      <div class="fm-att-head"><label>🎨 컬러 옵션 <span class="en">/ Color options — 사진으로 저장·재사용</span></label><button class="mini-btn" id="fmColorAdd">${I.plus} 컬러 추가 / Add color</button></div>
      <div id="fmColorList" class="color-list"></div>
      <div id="fmColorPicker" class="color-picker" style="display:none">
        <div class="cp-sec"><div class="cp-title">저장된 컬러 (클릭하면 사진째 추가) / Saved colors — click to reuse</div><div id="cpLib" class="cp-lib"></div></div>
        <div class="cp-sec cp-new"><div class="cp-title">새 컬러 만들기 / New color</div>
          <div class="cp-new-row">
            <div class="pastezone cp-paste" id="cpPaste" tabindex="0"><div class="pz-inner" id="cpPzInner">${I.paste}<b>컬러 사진 / Swatch</b><span>클릭·드래그·Ctrl+V</span></div></div>
            <div class="cp-new-fields"><input id="cpName" placeholder="컬러 이름 / color name (예: 그레이 / Gray)"/><button class="mini-btn mini-add" id="cpSave">${I.plus} 저장·추가 / Save</button></div>
          </div>
