<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To. 채원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#4a3c31; --mut:#b3a394; --line:#eadfd2; --accent:#8a5a3c; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ background:#faf6f0; }
  body{ font-family:'Nanum Pen Script',cursive; color:var(--ink); line-height:1.75;
    display:flex; justify-content:center; padding:26px 16px 46px; }
  .card{ width:100%; max-width:420px; background:#ffffff; border:1px solid var(--line);
    border-radius:16px; padding:36px 28px 30px; box-shadow:0 8px 26px rgba(90,60,30,.08); text-align:center; }
  .emoji{ font-size:34px; }
  .to{ font-family:'Jua',sans-serif; font-size:20px; color:var(--accent); letter-spacing:1px; margin:12px 0 4px; }
  .hair{ height:0; border-top:1.5px solid var(--line); width:58px; margin:16px auto 20px; }
  p{ font-size:25px; margin:0 0 14px; }
  .sign{ font-family:'Jua',sans-serif; font-size:15px; color:var(--mut); text-align:right; margin-top:26px; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🍫</div>
    <div class="to">To. 채원</div>
    <div class="hair"></div>

    <p>법인을 처음 설립하면서 도움이 필요할 때가 많았는데, 채원씨 덕에 많은 문제들을 해결했어요. 늘 고맙게 생각하는 거 알죠?</p>
    <p>맘이 예쁜 채원씨, 늘 응원해요!</p>

    <div class="sign">From. Jinha Lee</div>
  </div>
</body>
</html>
